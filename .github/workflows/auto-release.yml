name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      - 'metadata.yaml'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      new_version: ${{ steps.check.outputs.version }}
      old_version: ${{ steps.check.outputs.old_version }}
      tag_name: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version change
        id: check
        run: |
          set -euo pipefail
          CURRENT_VERSION_RAW=$(sed -n 's/^version:[[:space:]]*//p' metadata.yaml | head -n1 | tr -d '\r')
          CURRENT_VERSION=${CURRENT_VERSION_RAW#v}
          echo "Current version: $CURRENT_VERSION"
          PREVIOUS_VERSION_RAW=$(git show HEAD~1:metadata.yaml 2>/dev/null | sed -n 's/^version:[[:space:]]*//p' | head -n1 | tr -d '\r' || true)
          PREVIOUS_VERSION=${PREVIOUS_VERSION_RAW#v}
          PREVIOUS_VERSION=${PREVIOUS_VERSION:-none}
          echo "Previous version: $PREVIOUS_VERSION"

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            echo "old_version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No version change detected"
          fi

  create-release:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare bilingual release notes
        env:
          VERSION: ${{ needs.check-version.outputs.new_version }}
          TAG: ${{ needs.check-version.outputs.tag_name }}
          OLD_VERSION: ${{ needs.check-version.outputs.old_version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTES_FILE=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" changelog.md
            echo "Using curated release notes: $NOTES_FILE"
          else
            python .github/scripts/generate_release_notes.py \
              "$VERSION" "$OLD_VERSION" "$REPOSITORY" > changelog.md
            echo "Generated release notes from conventional commits"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag_name }}
          name: Mnemosyne ${{ needs.check-version.outputs.tag_name }}
          body_path: changelog.md
          draft: false
          prerelease: ${{ contains(needs.check-version.outputs.new_version, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify release created
        run: |
          echo "Release ${{ needs.check-version.outputs.tag_name }} created."
          echo "https://github.com/${{ github.repository }}/releases/tag/${{ needs.check-version.outputs.tag_name }}"
