name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python -r requirements.txt quart pytest pytest-asyncio ruff

      - name: Lint
        run: uv run --no-project --python .venv/bin/python ruff check --select E,F --ignore E501 --exclude tests .

      - name: Test
        run: uv run --no-project --python .venv/bin/python pytest tests -q

  docs:
    runs-on: ubuntu-latest
    env:
      DOCS_BASE: /astrbot_plugin_mnemosyne/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install documentation dependencies
        run: npm ci --no-audit --no-fund

      - name: Build documentation
        run: npm run docs:build
